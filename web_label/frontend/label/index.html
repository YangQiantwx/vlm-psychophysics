<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Label · Visual perception</title><link rel="stylesheet" href="style.css?v=df5feff5d626"></head>
<body><main><nav><a href="/experiments/?task=overview">Visual perception</a><a href="/library/">Library</a><span aria-current="page">Label</span><span id="trial-preview">Preview</span><button id="change-identity" class="identity-exit" aria-label="Change identity" hidden>Exit</button></nav>
<header><h1>Watch. Then choose.</h1><span id="mode">Preview</span></header>
<div id="connection-progress" role="status" hidden><span id="connection-label"></span><progress aria-label="Connecting"></progress></div>
<section id="identity"><form id="identity-form"><label for="email">Email</label><div class="form-row"><input id="email" type="email" autocomplete="off" placeholder="you@example.com" required><button type="submit" class="primary">Continue</button></div><p>Your saved identity · No email is sent</p></form></section>
<section id="choose" hidden><div class="section-row"><h2>Choose a task</h2></div><div id="tasks"></div></section>
<section id="trial" hidden><div class="section-row"><h2 id="task-title"></h2><span id="progress"></span></div><div class="progress-track"><div id="progress-fill"></div></div><p id="prompt"></p><div id="stimulus-pair"><figure id="reference" hidden><img id="reference-image" alt="Target orientation reference"><figcaption>Target orientation</figcaption></figure><div id="stage"><video aria-hidden="true" id="video" width="768" height="512" playsinline muted preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1"></video><div id="screen"><div class="loading-content"><span id="screen-label">Loading video…</span><div id="loading-details" hidden><progress id="load-progress" max="1" aria-label="Video download"></progress><span id="load-amount"></span></div></div></div></div></div><div class="display-row"><span id="display-size">768 × 512</span><span>One playback</span></div><div id="actions"><button id="play" class="primary" disabled>Play once</button><div id="answers" hidden></div><button id="skip" hidden>Continue without a response</button></div></section>
<div id="delivery-state"><span id="buffer-status"></span><span id="sync-status" role="status" aria-live="polite"></span></div>
<button id="retry-save" hidden>Retry saving playback</button>
<section id="done" hidden><h2 id="done-title">Batch saved.</h2><p id="done-message">Every response is saved.</p><button id="next" class="primary">Next batch</button><button id="other">Choose another task</button></section>
<p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="app.js?v=a7d8cc2cd431"></script></body></html>
